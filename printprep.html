<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Verdana,Geneva,sans-serif;color:#1a1e2a;background:#f5f4f0;overflow:hidden;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Verdana,Geneva,sans-serif;font-weight:400}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(45,124,181,0.3);border-radius:3px}
.nz{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0.035;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}

/* ---------------------------------------------------------------- nav */
.nv{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;
    padding:10px 20px;background:rgba(245,244,240,0.92);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
    border-bottom:1px solid rgba(45,124,181,0.12);height:48px}
.nv-logo{display:flex;align-items:center;gap:8px;text-decoration:none;font-weight:600;font-size:16px;color:#2d7cb5;letter-spacing:-0.02em}
.nv-mid{display:flex;align-items:center;gap:10px}
.nv-title{font-size:10px;font-weight:600;letter-spacing:0.2em;text-transform:uppercase;color:rgba(0,0,0,0.35)}
.nv-right{display:flex;align-items:center;gap:14px}
.nv-link{font-size:11px;font-weight:500;letter-spacing:0.05em;text-transform:uppercase;color:rgba(0,0,0,0.45);
         text-decoration:none;background:none;border:none;font-family:inherit;cursor:pointer;transition:color .3s}
.nv-link:hover{color:#2d7cb5}

/* ---------------------------------------------------------------- gate */
.gate{position:fixed;inset:0;z-index:900;background:#f5f4f0;display:flex;align-items:center;justify-content:center;
      transition:opacity .5s cubic-bezier(.16,1,.3,1)}
.gate.hidden{opacity:0;pointer-events:none}
.gate-card{width:min(400px,90vw);text-align:center}
.gate-mark{font-size:26px;font-weight:600;color:#2d7cb5;letter-spacing:-0.02em;margin-bottom:6px}
.gate-sub{font-size:10px;font-weight:600;letter-spacing:0.22em;text-transform:uppercase;color:rgba(0,0,0,0.3);margin-bottom:36px}
.gate-row{display:flex;gap:8px}
.gate-in{flex:1;height:44px;padding:0 16px;font-family:Verdana,Geneva,sans-serif;font-size:13px;color:#1a1e2a;
         background:rgba(255,255,255,0.7);border:1px solid rgba(0,0,0,0.1);border-radius:60px;outline:none;transition:border-color .3s}
.gate-in:focus{border-color:rgba(45,124,181,0.45)}
.gate-go{height:44px;padding:0 28px;font-size:11px;font-weight:600;letter-spacing:0.07em;text-transform:uppercase;
         background:#2d7cb5;color:#fff;border:none;border-radius:60px;cursor:pointer;font-family:Verdana,Geneva,sans-serif;transition:all .3s}
.gate-go:hover:not(:disabled){background:#4a9fd4}
.gate-go:disabled{opacity:.5;cursor:default}
.gate-msg{font-size:11px;color:rgba(0,0,0,0.35);margin-top:18px;min-height:16px;line-height:1.5}
.gate-msg.err{color:#b5432d}
.gate-foot{font-size:10px;color:rgba(0,0,0,0.2);margin-top:44px;letter-spacing:.04em}
@keyframes shake{10%,90%{transform:translateX(-2px)}30%,70%{transform:translateX(4px)}50%{transform:translateX(-4px)}}
.gate-card.bad{animation:shake .4s}

/* ---------------------------------------------------------------- app frame */
#pp{position:fixed;inset:48px 0 0 0;display:none;grid-template-columns:264px 1fr 288px;gap:0;z-index:10}
#pp.on{display:grid}
.pane{background:rgba(255,255,255,0.55);backdrop-filter:blur(12px);overflow-y:auto;overflow-x:hidden;
      display:flex;flex-direction:column;gap:8px;padding:12px 12px 40px}
.pane-l{border-right:1px solid rgba(45,124,181,0.12)}
.pane-r{border-left:1px solid rgba(45,124,181,0.12)}
#stage{position:relative;background:#eeeee8;min-width:0}
#stage canvas{display:block;width:100%;height:100%}

/* ---------------------------------------------------------------- controls, after the index.html configurator */
.card{background:rgba(255,255,255,0.62);border:1px solid rgba(0,0,0,0.06);border-radius:10px;padding:11px 14px;position:relative}
.card.flush{padding:0;overflow:hidden}
.card-t{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:#2d7cb5;
        margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:6px}
.card-t .n{color:rgba(0,0,0,0.28);font-weight:600;letter-spacing:.5px}
.row{display:flex;align-items:center;gap:6px;min-height:26px}
.row+.row{margin-top:3px}
.lbl{width:104px;flex-shrink:0;font-size:11px;color:rgba(0,0,0,0.5);display:flex;align-items:center;gap:5px}
.lbl.w{width:74px}
.info{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,0.15);display:inline-flex;align-items:center;
      justify-content:center;font-size:8px;color:rgba(0,0,0,0.3);cursor:help;position:relative;flex-shrink:0}
.info:hover .tip{display:block}
.tip{display:none;position:absolute;top:50%;right:calc(100% + 10px);transform:translateY(-50%);width:210px;padding:10px 12px;
     background:#fff;color:rgba(0,0,0,0.7);font-size:11px;line-height:1.45;border-radius:8px;border:1px solid rgba(0,0,0,0.08);
     z-index:300;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,0.12);white-space:normal;text-align:left}
.pane-l .tip{right:auto;left:calc(100% + 10px)}
input[type=range]{flex:1;min-width:0;height:3px;accent-color:#2d7cb5;cursor:pointer;background:rgba(45,124,181,0.12);
                  border-radius:2px;-webkit-appearance:none;appearance:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#2d7cb5;
                                        cursor:pointer;border:2px solid #f5f4f0}
input[type=number],input[type=text],select{height:24px;background:rgba(255,255,255,0.8);border:1px solid rgba(0,0,0,0.1);
    border-radius:5px;padding:0 6px;font-size:11px;font-family:Verdana,Geneva,sans-serif;color:#1a1e2a}
input[type=number]{width:56px;text-align:right}
select{flex:1;min-width:0;cursor:pointer}
input:focus,select:focus{outline:none;border-color:rgba(45,124,181,0.4)}
.unit{width:24px;font-size:10px;color:rgba(0,0,0,0.35);flex-shrink:0}
.chk{display:flex;align-items:center;gap:7px;font-size:11px;color:rgba(0,0,0,0.55);cursor:pointer;user-select:none}
.chk input{accent-color:#2d7cb5;cursor:pointer;width:13px;height:13px}
.btn{padding:8px 14px;border-radius:60px;font-size:10px;font-weight:600;letter-spacing:0.07em;text-transform:uppercase;
     border:none;cursor:pointer;font-family:Verdana,Geneva,sans-serif;transition:all .25s;background:#2d7cb5;color:#fff;white-space:nowrap}
.btn:hover:not(:disabled){background:#4a9fd4;box-shadow:0 6px 22px rgba(45,124,181,0.25)}
.btn:disabled{opacity:.35;cursor:default;box-shadow:none}
.btn.g{background:transparent;color:#2d7cb5;border:1.5px solid rgba(45,124,181,0.3)}
.btn.g:hover:not(:disabled){border-color:#2d7cb5;background:rgba(45,124,181,0.06);box-shadow:none}
.btn.sm{padding:5px 11px;font-size:9px;letter-spacing:.05em}
.btn.wide{width:100%;justify-content:center}
.btnrow{display:flex;gap:6px;flex-wrap:wrap}

/* segmented toggle, from the configurator's preset buttons */
.seg{display:flex;background:rgba(0,0,0,0.04);border-radius:7px;padding:2px;gap:2px}
.seg button{flex:1;padding:5px 6px;border-radius:5px;font-size:10px;font-weight:600;border:none;cursor:pointer;
            font-family:Verdana,Geneva,sans-serif;background:transparent;color:rgba(0,0,0,0.4);transition:all .15s;white-space:nowrap}
.seg button.on{background:rgba(45,124,181,0.22);color:#2d7cb5}
.seg button:hover:not(.on){color:rgba(0,0,0,0.65)}

/* stepped slider with tick labels, for the joint Fit control */
.steps{display:flex;justify-content:space-between;margin:5px 2px 0;font-size:8px;letter-spacing:.04em;
       text-transform:uppercase;color:rgba(0,0,0,0.25)}
.steps span{cursor:pointer;transition:color .2s;flex:1;text-align:center}
.steps span:first-child{text-align:left}.steps span:last-child{text-align:right}
.steps span.on{color:#2d7cb5;font-weight:700}

/* part list */
.plist{display:flex;flex-direction:column}
.pitem{display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;border-bottom:1px solid rgba(0,0,0,0.045);
       transition:background .15s;font-size:11px}
.pitem:last-child{border-bottom:none}
.pitem:hover{background:rgba(45,124,181,0.07)}
.pitem.sel{background:rgba(45,124,181,0.14)}
.pitem .sw{width:9px;height:9px;border-radius:2px;flex-shrink:0}
.pitem .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:rgba(0,0,0,0.7)}
.pitem .dim{font-size:9px;color:rgba(0,0,0,0.3);white-space:nowrap;font-variant-numeric:tabular-nums}
.pitem .warn{color:#b5432d;font-size:11px}

/* stat strip */
.stats{display:flex;gap:14px;flex-wrap:wrap}
.stat{min-width:56px}
.stat-k{font-size:8px;color:rgba(0,0,0,0.32);text-transform:uppercase;letter-spacing:.5px}
.stat-v{font-size:14px;font-weight:700;line-height:1.25;font-variant-numeric:tabular-nums}
.stat-v .u{font-size:9px;font-weight:400;color:rgba(0,0,0,0.3);margin-left:2px}

/* stage overlays */
.drop{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
      text-align:center;color:rgba(0,0,0,0.35);font-size:13px;font-weight:300;pointer-events:none;z-index:5}
.drop.hot{background:rgba(45,124,181,0.07);outline:2px dashed rgba(45,124,181,0.4);outline-offset:-16px}
.drop .big{font-size:20px;color:rgba(0,0,0,0.5)}
.drop .btn{pointer-events:auto}
.hud{position:absolute;left:14px;bottom:14px;z-index:6;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.hud .seg{background:rgba(255,255,255,0.8);border:1px solid rgba(0,0,0,0.06);backdrop-filter:blur(10px)}
.vhud{position:absolute;right:14px;top:14px;z-index:6;font-size:10px;color:rgba(0,0,0,0.3);text-align:right;
      line-height:1.6;font-variant-numeric:tabular-nums;pointer-events:none}
.tag{position:absolute;left:14px;top:14px;z-index:6;font-size:9px;font-weight:600;letter-spacing:.16em;
     text-transform:uppercase;color:rgba(0,0,0,0.25);pointer-events:none}

/* hover card for per-part print preview */
.hovercard{position:absolute;z-index:20;width:250px;background:rgba(255,255,255,0.96);backdrop-filter:blur(16px);
           border:1px solid rgba(45,124,181,0.18);border-radius:12px;padding:12px;box-shadow:0 16px 50px rgba(0,0,0,0.14);
           pointer-events:none;opacity:0;transition:opacity .18s}
.hovercard.on{opacity:1;pointer-events:auto}

/* progress + toast */
.prog{position:absolute;left:0;right:0;top:0;height:2px;background:transparent;z-index:30;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:#2d7cb5;transition:width .2s}
.toast{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:40;background:rgba(26,30,42,0.92);
       color:#fff;font-size:11px;padding:9px 16px;border-radius:60px;opacity:0;transition:opacity .3s;pointer-events:none;
       max-width:70%;text-align:center;line-height:1.5}
.toast.on{opacity:1}
.toast.err{background:#b5432d}

.empty{font-size:11px;color:rgba(0,0,0,0.28);line-height:1.6;padding:2px 0}
.note{font-size:10px;color:rgba(0,0,0,0.32);line-height:1.55;margin-top:7px}
.note.warn{color:#b5432d}
hr{border:none;border-top:1px solid rgba(0,0,0,0.07);margin:9px 0}
@media(max-width:1100px){#pp{grid-template-columns:230px 1fr 250px}}
</style>
</head>

  const $ = (id) => document.getElementById(id);
  const form = $('gate-form'), input = $('gate-pw'), go = $('gate-go'),
        msg = $('gate-msg'), card = $('gate-card'), gate = $('gate');

  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

  function say(text, isError) {
    msg.textContent = text || '';
    msg.classList.toggle('err', !!isError);
  }

  async function gunzip(bytes) {
    const ds = new DecompressionStream('gzip');
    const stream = new Blob([bytes]).stream().pipeThrough(ds);
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }

  async function unlock(password) {
    const enc = new TextEncoder();
    const base = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: b64(SALT), iterations: ROUNDS, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    // Throws OperationError on a wrong password: GCM authenticates, so a bad key
    // cannot yield plausible-looking plaintext.
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(IV) }, key, b64(PAYLOAD));
    return JSON.parse(new TextDecoder().decode(await gunzip(new Uint8Array(plain))));
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const pw = input.value;
    if (!pw) return;
    go.disabled = true; input.disabled = true;
    say('Deriving key…');
    let bundle;
    try {
      bundle = await unlock(pw);
    } catch (err) {
      go.disabled = false; input.disabled = false;
      input.value = ''; input.focus();
      card.classList.remove('bad'); void card.offsetWidth; card.classList.add('bad');
      say('That password does not decrypt this page.', true);
      return;
    }
    say('Starting…');
    try {
      const url = URL.createObjectURL(new Blob([bundle.app], { type: 'text/javascript' }));
      const mod = await import(url);
      URL.revokeObjectURL(url);
      gate.classList.add('hidden');
      $('pp').classList.add('on');
      setTimeout(() => gate.remove(), 600);
      await mod.boot({
        workerSources: { geom: bundle.geomWorker, csg: bundle.csgWorker },
        baseUrl: new URL('.', location.href).href,
      });
    } catch (err) {
      console.error(err);
      say('Unlocked, but the tool failed to start: ' + (err && err.message ? err.message : err), true);
      go.disabled = false; input.disabled = false;
    }
  });

  // Surface the two environment requirements up front rather than failing
  // halfway through a boolean with something cryptic.
  if (!window.WebAssembly) say('This browser has no WebAssembly. The geometry engine needs it.', true);
  else if (!window.crypto || !crypto.subtle) say('Needs a secure context (https) for the unlock to work.', true);
})();
